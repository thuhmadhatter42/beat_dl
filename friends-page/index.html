<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>Beat Key</title><link rel="icon" href="/icon.png">
<style>
:root{--bg:#0d0c0b;--plate:#1a1816;--line:#2c2925;--amber:#f2b33d;--text:#ece6dc;--dim:#9a9389}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 50% 0,#211e1a,var(--bg) 70%);color:var(--text);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;padding:16px}
main{width:100%;max-width:420px;background:var(--plate);border:1px solid var(--line);border-radius:18px;padding:32px 28px;box-shadow:0 20px 50px rgba(0,0,0,.55);text-align:center}
img{width:112px;height:112px;border-radius:25px;box-shadow:0 8px 24px rgba(0,0,0,.6)}
h1{margin:18px 0 4px;font-size:22px;letter-spacing:.32em;font-weight:700}
.sub{margin:0 0 22px;color:var(--dim);font-size:14px}
input{width:100%;padding:13px 14px;border-radius:10px;border:1px solid #3a3530;background:#0f0e0d;color:var(--text);font-size:16px;outline:none}
input:focus{border-color:var(--amber)}
button{margin-top:12px;width:100%;padding:13px;border:0;border-radius:10px;background:var(--amber);color:#1a1205;font-weight:700;letter-spacing:.12em;font-size:14px;cursor:pointer}
button:hover{filter:brightness(1.08)}
.msg{color:#ff8a6a;font-size:14px;min-height:1em;margin:10px 0 0}
.fine{margin-top:18px;color:var(--dim);font-size:12px}
.fine a{color:var(--dim)}
</style></head><body><main>
<img src="/icon.png" alt="">
<h1>BEAT KEY</h1>
<p class="sub">Paste a YouTube link, get an MP3 named with its BPM and key.</p>
<form method="post" action="/download">
<input type="email" name="email" placeholder="Your email" required autocomplete="email">
<button type="submit">DOWNLOAD FOR MAC</button>
</form>
<p class="msg">{{MSG}}</p>
<p class="fine">Version {{VERSION}} · macOS 12 or later · Apple Silicon or Intel · updates itself<br>
Free and open source (AGPL-3.0) · <a href="https://github.com/thuhmadhatter42/beat_dl">source and licences</a></p>
</main></body></html>
